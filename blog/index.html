<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ideas, criterios y aprendizajes de Klef Agency sobre estrategia, marca, tecnología y crecimiento desde Los Cabos." />
    <link rel="canonical" href="https://klef.agency/blog/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Blog | Klef Agency" />
    <meta property="og:description" content="Ideas, criterios y aprendizajes sobre estrategia, marca, tecnología y crecimiento." />
    <meta property="og:url" content="https://klef.agency/blog/" />
    <meta name="twitter:card" content="summary" />
    <title>Blog | Klef Agency</title>
    <link rel="stylesheet" href="../assets/styles/blog.css?v=2" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Blog",
        "name": "Blog de Klef Agency",
        "description": "Ideas, criterios y aprendizajes sobre estrategia, marca, tecnología y crecimiento.",
        "url": "https://klef.agency/blog/",
        "publisher": { "@type": "Organization", "name": "Klef Agency", "url": "https://klef.agency/" }
      }
    </script>
  </head>
  <body>
    <article class="klef-blog-page" data-shell-content aria-labelledby="blog-title">
      <nav class="klef-blog-breadcrumbs" aria-label="Breadcrumb"><a href="/">Klef Agency</a><span aria-hidden="true">/</span><span>Blog</span></nav>
      <header class="klef-blog-hero">
        <div><p class="klef-blog-kicker">Notas de Klef</p><h1 id="blog-title">Ideas para lo que sigue.</h1></div>
        <p class="klef-blog-intro">Criterios, aprendizajes y preguntas sobre estrategia, marca, producto digital, desarrollo y crecimiento.</p>
      </header>

      <section aria-labelledby="blog-list-title">
        <div class="klef-blog-toolbar">
          <label class="klef-blog-search-label" for="blog-search">Buscar artículos</label>
          <input class="klef-blog-search" id="blog-search" type="search" placeholder="Buscar en el blog..." aria-label="Buscar en el blog" />
          <div class="klef-blog-filters" id="blog-filters" aria-label="Filtrar artículos"></div>
        </div>
        <h2 id="blog-list-title" class="klef-blog-results">Artículos recientes</h2>
        <div class="klef-blog-grid" id="blog-grid">
          <!-- STATIFY:BLOG_START -->
          <div class="klef-blog-empty" data-statify-static>No hay artículos publicados todavía.</div>
          <!-- STATIFY:BLOG_END -->
        </div>
      </section>

      <noscript><p>Activa JavaScript para buscar y filtrar los artículos. También puedes explorar el contenido publicado en esta página.</p></noscript>
    </article>
    <script src="../shared/components/load-basics/load-basics.js?v=10"></script>
    <script src="../assets/scripts/blog-page-layout.js"></script>
    <script src="../shared/components/blog/blog-index-loader.js"></script>
  </body>
</html>
